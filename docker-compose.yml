services:
  live:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    volumes: ["./config.yaml:/app/config.yaml"]   # watchlist edits persist on your machine
    restart: unless-stopped
  report:
    build: .
    command: python -m stock_analyzer --llm --notify
    env_file: [.env]
    environment:
      LLM_BASE_URL: http://ollama:11434/v1
    volumes: ["./reports:/app/reports"]
    depends_on: [ollama]
    profiles: ["report"]
  ollama:
    image: ollama/ollama:latest
    volumes: ["ollama:/root/.ollama"]
    profiles: ["report"]
volumes:
  ollama:
