name: Daily Stock Analysis

on:
  schedule:
    # Times are UTC. Each run happens after that market closes.
    - cron: "30 8 * * 1-5"   # India & China close (14:00 IST / 16:00 CST)
    - cron: "0 17 * * 1-5"   # Europe close (~17:30 CET)
    - cron: "30 21 * * 1-5"  # US close (16:00 ET + buffer)
  workflow_dispatch:
    inputs:
      markets:
        description: "Markets (space separated: india us china europe)"
        default: "india us china europe"

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Pick markets for this schedule
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "30 8 * * 1-5")  echo "markets=india china" >> "$GITHUB_OUTPUT" ;;
            "0 17 * * 1-5")  echo "markets=europe" >> "$GITHUB_OUTPUT" ;;
            "30 21 * * 1-5") echo "markets=us" >> "$GITHUB_OUTPUT" ;;
            *)               echo "markets=${{ github.event.inputs.markets || 'india us china europe' }}" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run analysis
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # Point at a reachable open-source LLM server to enable AI commentary
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: python -m stock_analyzer --markets ${{ steps.pick.outputs.markets }} --notify -o reports/${{ github.run_id }}

      - uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.run_id }}
          path: reports/${{ github.run_id }}
          retention-days: 30
