name: Live app smoke test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps chromium
      - name: Exercise the live app against real data
        run: python scripts/live_smoke.py smoke
      - name: Publish results to the smoke-test branch
        if: always()
        run: |
          cd smoke
          git init -q -b smoke-test
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Smoke test ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" smoke-test
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
